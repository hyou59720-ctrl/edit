name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Amharic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Remotion Browser (Headless Chrome)
        run: npx remotion browser ensure

      - name: Render Video
        run: npx remotion render ThreeDPhone out/video.mp4 --gl=angle

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
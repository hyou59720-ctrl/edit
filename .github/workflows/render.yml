name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium GL Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 mesa-utils \
            libgl1-mesa-dri libglx-mesa0 fonts-noto-core

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Remotion Browser
        run: npx remotion browser ensure

      - name: Render Video
        run: npx remotion render ThreeDPhone out/video.mp4 --gl=swiftshader --concurrency=1

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4